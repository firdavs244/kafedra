<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="KafedraAgent — kafedra mudiri uchun sun'iy intellekt yordamchisi: yuklama, ilmiy ishlar, KPI, davomat va talabalar bir joyda." />
    <meta name="theme-color" content="#1d4fd8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <title>KafedraAgent</title>
    <script>
      // Mavzu (yorug'/qorong'i) sahifa chizilishidan oldin qo'llansin — miltillamasin.
      try {
        var t = localStorage.getItem('ka_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>KafedraAgent ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
