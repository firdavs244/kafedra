# KafedraAgent on the server's bare IP: http://<SERVER_IP>/
#
# `default_server` takes only the requests that name NO known host - the bare
# IP, or an unknown name. Every site that declares its own server_name keeps
# matching it exactly as before, so this file can be added or removed without
# touching any other project's configuration.
#
# Installed as a COPY, never a symlink into the git checkout: nginx re-reads
# every enabled file on any reload, so a broken edit pushed to this repo would
# fail `nginx -t` for every site on the box, not just this one.
#
# Install:  cp deploy/server/nginx-kafedra-ip.conf /etc/nginx/sites-available/kafedra-ip.conf
#           ln -s /etc/nginx/sites-available/kafedra-ip.conf /etc/nginx/sites-enabled/kafedra-ip.conf
#           nginx -t && systemctl reload nginx
# Remove:   rm /etc/nginx/sites-enabled/kafedra-ip.conf && nginx -t && systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    # Uploads are capped at 10 MB by the app, sent base64-encoded (x1.37).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # The evaluation run answers in 20-30 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
