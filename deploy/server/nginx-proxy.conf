# The nginx INSIDE the kafedra compose project - not the host's. It is the
# only container with a published port (8080) and forwards to the app over
# the project's private network.
server {
    listen 80;
    server_name _;

    # Uploads are capped at 10 MB by the app, sent base64-encoded (x1.37).
    client_max_body_size 15m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    # Docker's resolver, re-asked every 10 s. A literal `proxy_pass
    # http://app:8000` is resolved ONCE at nginx start: after the app container
    # is recreated with a new address, the proxy would keep sending to the old
    # one and answer 502 until someone restarted it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        # The evaluation run answers in 20-30 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }
}
